<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src https://raw.githubusercontent.com; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="description" content="Escritório virtual em pixel art que mostra o estado real de agentes do Claude Code.">
<title>AI AGENT OFFICE CLOUD</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header id="top">
  <h1>AI AGENT OFFICE CLOUD</h1>
  <div id="banner" role="status" aria-live="polite" hidden></div>
</header>
<main id="stage">
  <canvas id="office" role="img" aria-label="Escritório virtual com os agentes em suas estações"></canvas>
  <noscript><p class="noscript">Este escritório precisa de JavaScript.</p></noscript>
</main>
<footer id="bottom">
  <ul id="legend" aria-label="Legenda dos estados"></ul>
  <div id="tools">
    <button id="btn-pause" type="button" aria-pressed="false">Pausar</button>
    <button id="btn-reduce" type="button" aria-pressed="false">Reduzir animações</button>
    <button id="btn-zoom-out" type="button" aria-label="Diminuir zoom">−</button>
    <button id="btn-zoom-in" type="button" aria-label="Aumentar zoom">+</button>
    <button id="btn-fit" type="button">Ajustar</button>
  </div>
  <p id="note">Os estados vêm de eventos reais publicados pelas sessões e podem ter alguns minutos de atraso. Sem dado recente, o agente aparece como desconhecido.</p>
</footer>
<ul id="sr" class="sr-only" aria-label="Estado dos agentes"></ul>
<script type="module" src="js/main.js"></script>
</body>
</html>
